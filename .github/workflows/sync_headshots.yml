name: Sync Headshots

on:
  schedule:
    - cron: '0 10 * * 1'  # Monday 10:00 UTC — after weekly predictions run
  workflow_dispatch:        # manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Merge headshot candidates into players_to_fetch.csv
        run: python scripts/merge_candidates.py

      - name: Build ESPN player index
        run: python sync_espn_headshots.py build-index

      - name: Download new headshots
        run: python sync_espn_headshots.py download

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Auto-sync headshots $(date -u +%Y-%m-%d)"
            git push
          fi
