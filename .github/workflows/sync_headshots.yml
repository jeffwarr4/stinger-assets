name: Sync Headshots

on:
  schedule:
    # Daily 11:37 UTC (off :00, when GitHub delays scheduled runs). The predictors
    # write candidates Mon (MLB), Tue (NFL) and Wed (NHL); a daily run picks each
    # up by the next morning instead of the following Monday. Commits only when
    # something new was downloaded.
    - cron: '37 11 * * *'
  workflow_dispatch:        # manual trigger from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: sync-headshots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Merge headshot candidates into players_to_fetch.csv
        run: python scripts/merge_candidates.py

      - name: Build ESPN player index
        run: python sync_espn_headshots.py build-index

      - name: Download new headshots
        run: python sync_espn_headshots.py download

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # The sync only adds or updates assets; a staged deletion means something
          # went wrong, and pushing it would remove assets for every consumer.
          DELETED=$(git diff --staged --diff-filter=D --name-only)
          if [ -n "$DELETED" ]; then
            echo "::error::Refusing to commit deletions:"
            echo "$DELETED"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Auto-sync headshots $(date -u +%Y-%m-%d)"
            git push
          fi
